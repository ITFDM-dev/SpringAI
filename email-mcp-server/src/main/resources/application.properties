spring.application.name=email-mcp-server
server.port=8083

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=email-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.request-timeout=30s

# Local debugging for MCP tool discovery and request handling.
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.org.springframework.ai.tool=DEBUG
logging.level.io.modelcontextprotocol=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${EMAIL_USERNAME}

# EMAIL_APP_PASSWORD must be a Gmail application password, not a normal account password.
